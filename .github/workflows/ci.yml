name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov=veil --cov-report=term-missing

      - name: Build
        run: uv build

      - name: Evaluate detectors (smoke check)
        run: |
          uv run python scripts/generate_corpus.py 10 > /tmp/corpus.jsonl
          uv run python scripts/evaluate.py /tmp/corpus.jsonl

  minimums:
    name: Oldest supported Python and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.10"

      # `requires-python` and every ">=" in pyproject.toml are promises. The lockfile tests
      # the newest versions; this installs the oldest ones the package says it accepts.
      - name: Install the oldest allowed version of each direct dependency
        run: |
          uv venv .venv-minimums
          uv pip install --python .venv-minimums --resolution lowest-direct -e ".[vault-crypto,anthropic,openai]" --group dev

      - name: Test
        run: .venv-minimums/bin/pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build
