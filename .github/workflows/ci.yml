name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov=veil --cov-report=term-missing

      - name: Build
        run: uv build

      - name: Evaluate detectors (smoke check)
        run: |
          uv run python scripts/generate_corpus.py 10 > /tmp/corpus.jsonl
          uv run python scripts/evaluate.py /tmp/corpus.jsonl
