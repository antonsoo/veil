[project]
name = "veil-pii"
version = "0.1.0"
description = "Reversible PII masking for LLM calls: mask before the prompt leaves your network, restore in the answer, streaming included."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Anton Soloviev" }]
keywords = [
    "pii",
    "privacy",
    "llm",
    "anonymization",
    "pseudonymization",
    "redaction",
    "data-masking",
    "gdpr",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# Zero runtime dependencies in the core. Everything below is optional.
dependencies = []

[project.urls]
Homepage = "https://antonsoo.github.io/veil/"
Repository = "https://github.com/antonsoo/veil"
Issues = "https://github.com/antonsoo/veil/issues"
Changelog = "https://github.com/antonsoo/veil/blob/main/CHANGELOG.md"

[project.optional-dependencies]
spacy = ["spacy>=3.7"]
vault-crypto = ["cryptography>=42"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
all = ["veil-pii[spacy,vault-crypto,anthropic,openai]"]

[project.scripts]
veil = "veil.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    "cryptography>=42",
    "anthropic>=0.40",
    "openai>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veil"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/veil"]
exclude = ["src/veil/backends/spacy_backend.py"]

[[tool.mypy.overrides]]
module = "veil.backends.spacy_backend"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["veil"]
